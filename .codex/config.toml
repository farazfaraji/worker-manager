[mcp_servers.mongodb]
command = "node"
args = ["mongodb-mcp/src/index.js"]
startup_timeout_sec = 20
tool_timeout_sec = 30
default_tools_approval_mode = "writes"

[mcp_servers.mongodb.env]
MONGODB_URI = "mongodb://127.0.0.1:27017/flow_builder?directConnection=true"
MONGODB_DATABASE = "flow_builder"
MONGODB_MCP_ALLOW_WRITES = "true"
