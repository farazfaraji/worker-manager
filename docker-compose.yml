version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: flow-builder-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=flow_builder
    entrypoint: [ "/usr/bin/mongod", "--bind_ip_all", "--replSet", "rs0" ]
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
    driver: local
